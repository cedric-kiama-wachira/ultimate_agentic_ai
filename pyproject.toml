[project]
name = "aieng"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.workspace]
members = [
    "apps/api",
]
